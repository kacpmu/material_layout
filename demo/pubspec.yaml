name: demo
description: "Runnable demo of the material_layout package."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Clean URLs on the web for the router entrypoint.
  flutter_web_plugins:
    sdk: flutter
  # Used only by lib/main_router.dart, which binds the inbox selection to the
  # URL.
  go_router: ^18.0.0
  # The package this demo shows, resolved from the repository root.
  material_layout:
    path: ../
  # The navigation bar and rail that material_layout's NavigationScaffold
  # places: Material 3 Expressive components, from the package's
  # development branch.
  material_navigation:
    git:
      url: https://github.com/kacpmu/material_navigation.git
      ref: experimental
  material_ui: ^1.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
