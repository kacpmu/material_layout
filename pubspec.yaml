name: material_layout
description: >-
  Material 3 adaptive layouts for Flutter: the canonical list-detail,
  supporting-pane and feed layouts, adaptive navigation placement, resizable
  panes, adaptive sheets and foldable support.
version: 0.0.1
repository: https://github.com/kacpmu/material_layout

topics:
  - layout
  - responsive
  - adaptive
  - material
  - ui

environment:
  # PopScope.onPopInvokedWithResult and Navigator.onDidRemovePage (used by
  # ListDetailLayout) landed in 3.24; ColorScheme.surfaceContainerLow and
  # Color.withValues need 3.27.
  sdk: ^3.13.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
