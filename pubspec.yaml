name: material_layout
description: >-
  Material 3 adaptive layouts for Flutter: the canonical list-detail,
  supporting-pane and feed layouts, adaptive navigation placement, resizable
  panes and adaptive sheets.
version: 0.1.0+1
repository: https://github.com/kacpmu/material_layout

screenshots:
  - description: The material layout preview.
    path: doc/preview.gif

topics:
  - layout
  - responsive
  - adaptive
  - material
  - ui

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
